<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bank Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

    <div class="max-w-xl mx-auto mt-10 bg-white shadow-lg rounded-2xl p-6">
        <h2 class="text-2xl font-semibold text-gray-800 mb-4">Welcome, <span class="text-blue-600">{{ name }}</span></h2>

        <p class="text-lg mb-6">
            <strong class="text-gray-700">Current Balance:</strong> 
            <span class="text-green-600 font-semibold">₹{{ balance }}</span>
        </p>

        <ul class="space-y-4">
            <li>
                <a href="/deposit" class="block text-center bg-blue-500 hover:bg-blue-600 text-white py-2 px-4 rounded-xl shadow-md transition">Deposit Money</a>
            </li>
            <li>
                <a href="/withdraw" class="block text-center bg-yellow-500 hover:bg-yellow-600 text-white py-2 px-4 rounded-xl shadow-md transition">Withdraw Money</a>
            </li>
            <li>
                <a href="/transactions" class="block text-center bg-gray-700 hover:bg-gray-800 text-white py-2 px-4 rounded-xl shadow-md transition">View Transactions</a>
            </li>
        </ul>
    </div>

</body>
</html>
