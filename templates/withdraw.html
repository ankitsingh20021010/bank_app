<!-- templates/withdraw.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Withdraw Amount</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

    <div class="max-w-md mx-auto mt-10 bg-white shadow-lg rounded-2xl p-6">
        <h3 class="text-2xl font-semibold text-gray-800 mb-4">Withdraw Amount</h3>

        <form method="post" class="space-y-4">
            <div>
                <label for="amount" class="block text-gray-700 font-medium mb-1">Amount (₹)</label>
                <input 
                    type="number" 
                    step="0.01" 
                    name="amount" 
                    id="amount"
                    required 
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400"
                />
            </div>

            <button 
                type="submit" 
                class="w-full bg-red-500 hover:bg-red-600 text-white py-2 px-4 rounded-lg shadow-md transition">
                Withdraw
            </button>
        </form>

        <p class="mt-6 text-gray-700 text-center">Welcome, <span class="text-blue-600 font-medium">{{ name }}</span></p>

        <div class="mt-4 text-center">
            <a href="/" class="text-blue-600 hover:underline">← Back to Dashboard</a>
        </div>
    </div>

</body>
</html>
